```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SMART CALCULATOR</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        .login-card {
            background: rgba(255,255,255,0.98);
            border-radius: 28px;
            padding: 30px 25px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.30);
        }

        .logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 15px;
            border-radius: 22px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            font-weight: 900;
            box-shadow: 0 10px 25px rgba(37,99,235,.35);
        }

        .brand {
            text-align: center;
            color: #0f172a;
            font-size: 25px;
            font-weight: 900;
        }

        .business {
            text-align: center;
            color: #64748b;
            margin-top: 5px;
            margin-bottom: 25px;
            font-size: 14px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #111827;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            border: none;
            padding: 12px;
            border-radius: 12px;
            background: #e5e7eb;
            color: #374151;
            font-weight: 700;
            cursor: pointer;
        }

        .tab.active {
            background: #2563eb;
            color: white;
        }

        .input-group {
            margin-bottom: 13px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 700;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
            background: #f9fafb;
        }

        input:focus {
            border-color: #2563eb;
            background: white;
            box-shadow: 0 0 0 3px rgba(37,99,235,.10);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .signup {
            background: #16a34a;
        }

        .signup:hover {
            background: #15803d;
        }

        .otp-btn {
            background: #7c3aed;
        }

        .otp-btn:hover {
            background: #6d28d9;
        }

        .forgot {
            text-align: right;
            margin-top: 10px;
        }

        .forgot button {
            border: none;
            background: transparent;
            color: #2563eb;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
            color: #94a3b8;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            background: #e5e7eb;
            flex: 1;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            font-weight: 600;
            min-height: 20px;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            color: #94a3b8;
        }

        .hidden {
            display: none !important;
        }

        #recaptcha-container {
            margin: 12px 0;
            display: flex;
            justify-content: center;
        }

        @media(max-width:480px) {
            .login-card {
                padding: 25px 18px;
                border-radius: 22px;
            }

            .brand {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">₹</div>

        <div class="brand">
            SMART CALCULATOR
        </div>

        <div class="business">
            Kushwaha Traders
        </div>

        <h2 id="title">Login</h2>

        <div class="tabs">
            <button id="emailTab"
                    class="tab active"
                    onclick="showEmailLogin()">
                📧 Email
            </button>

            <button id="phoneTab"
                    class="tab"
                    onclick="showPhoneLogin()">
                📱 Mobile
            </button>
        </div>


        <!-- EMAIL LOGIN -->

        <div id="emailSection">

            <div class="input-group">
                <label>Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email">
            </div>


            <div class="input-group">
                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    autocomplete="current-password">
            </div>


            <button class="btn"
                    onclick="loginUser()">
                🔐 LOGIN
            </button>


            <button class="btn signup"
                    onclick="createAccount()">
                🆕 CREATE ACCOUNT
            </button>


            <div class="forgot">
                <button onclick="forgotPassword()">
                    Forgot Password?
                </button>
            </div>

        </div>


        <!-- PHONE LOGIN -->

        <div id="phoneSection" class="hidden">

            <div class="input-group">
                <label>Mobile Number</label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="+91XXXXXXXXXX"
                    autocomplete="tel">
            </div>


            <div id="recaptcha-container"></div>


            <button class="btn otp-btn"
                    onclick="sendOTP()">
                📲 SEND OTP
            </button>


            <div id="otpSection" class="hidden">

                <div class="input-group">
                    <label>Enter OTP</label>

                    <input
                        type="number"
                        id="otp"
                        placeholder="Enter 6 digit OTP"
                        inputmode="numeric">
                </div>


                <button class="btn signup"
                        onclick="verifyOTP()">
                    ✅ VERIFY OTP
                </button>

            </div>

        </div>


        <div id="message" class="message"></div>


        <div class="footer">
            © 2026 Kushwaha Traders<br>
            SMART CALCULATOR
        </div>

    </div>

</div>


<script type="module">

    /*
    ============================================================
       FIREBASE CONFIGURATION
    ============================================================

       REPLACE THE VALUES BELOW WITH YOUR FIREBASE CONFIG.

       Firebase Console:
       Project Settings
       → General
       → Your apps
       → Web app
       → SDK setup and configuration
    */

    import {
        initializeApp
    } from
    "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


    import {
        getAuth,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        sendPasswordResetEmail,
        RecaptchaVerifier,
        signInWithPhoneNumber,
        onAuthStateChanged
    } from
    "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    const firebaseConfig = {

        apiKey: "YOUR_API_KEY",

        authDomain:
            "YOUR_PROJECT.firebaseapp.com",

        projectId:
            "YOUR_PROJECT_ID",

        storageBucket:
            "YOUR_PROJECT.firebasestorage.app",

        messagingSenderId:
            "YOUR_SENDER_ID",

        appId:
            "YOUR_APP_ID"

    };


    const firebaseApp =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(firebaseApp);


    let confirmationResult = null;

    let recaptchaVerifier = null;


    /*
    ============================================================
       MESSAGE
    ============================================================
    */

    function showMessage(text, success = false) {

        const message =
            document.getElementById("message");

        message.textContent = text;

        message.style.color =
            success ? "#16a34a" : "#dc2626";
    }


    /*
    ============================================================
       EMAIL LOGIN
    ============================================================
    */

    window.loginUser = async function () {

        const email =
            document.getElementById("email")
            .value.trim();

        const password =
            document.getElementById("password")
            .value;


        if (!email || !password) {

            showMessage(
                "Please enter email and password."
            );

            return;
        }


        try {

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


            showMessage(
                "Login successful. Opening calculator...",
                true
            );


            setTimeout(() => {

                window.location.href =
                    "index.html";

            }, 700);


        } catch (error) {

            showMessage(
                getFirebaseError(error)
            );

        }

    };


    /*
    ============================================================
       CREATE ACCOUNT
    ============================================================
    */

    window.createAccount = async function () {

        const email =
            document.getElementById("email")
            .value.trim();

        const password =
            document.getElementById("password")
            .value;


        if (!email || !password) {

            showMessage(
                "Please enter email and password."
            );

            return;
        }


        if (password.length < 6) {

            showMessage(
                "Password must be at least 6 characters."
            );

            return;
        }


        try {

            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


            showMessage(
                "Account created successfully!",
                true
            );


            setTimeout(() => {

                window.location.href =
                    "index.html";

            }, 800);


        } catch (error) {

            showMessage(
                getFirebaseError(error)
            );

        }

    };


    /*
    ============================================================
       FORGOT PASSWORD
    ============================================================
    */

    window.forgotPassword = async function () {

        const email =
            document.getElementById("email")
            .value.trim();


        if (!email) {

            showMessage(
                "Enter your email first."
            );

            return;
        }


        try {

            await sendPasswordResetEmail(
                auth,
                email
            );


            showMessage(
                "Password reset email sent.",
                true
            );


        } catch (error) {

            showMessage(
                getFirebaseError(error)
            );

        }

    };


    /*
    ============================================================
       MOBILE LOGIN
    ============================================================
    */

    window.sendOTP = async function () {

        const phone =
            document.getElementById("phone")
            .value.trim();


        if (!phone) {

            showMessage(
                "Enter your mobile number."
            );

            return;
        }


        if (!phone.startsWith("+")) {

            showMessage(
                "Use international format, e.g. +919876543210"
            );

            return;
        }


        try {

            if (!recaptchaVerifier) {

                recaptchaVerifier =
                    new RecaptchaVerifier(
                        auth,
                        "recaptcha-container",
                        {
                            size: "normal"
                        }
                    );
            }


            confirmationResult =
                await signInWithPhoneNumber(
                    auth,
                    phone,
                    recaptchaVerifier
                );


            document
                .getElementById("otpSection")
                .classList.remove("hidden");


            showMessage(
                "OTP sent to your mobile.",
                true
            );


        } catch (error) {

            showMessage(
                getFirebaseError(error)
            );

        }

    };


    /*
    ============================================================
       VERIFY OTP
    ============================================================
    */

    window.verifyOTP = async function () {

        const otp =
            document.getElementById("otp")
            .value.trim();


        if (!otp) {

            showMessage(
                "Enter the OTP."
            );

            return;
        }


        if (!confirmationResult) {

            showMessage(
                "Please request an OTP first."
            );

            return;
        }


        try {

            await confirmationResult.confirm(
                otp
            );


            showMessage(
                "Mobile verified. Opening calculator...",
                true
            );


            setTimeout(() => {

                window.location.href =
                    "index.html";

            }, 700);


        } catch (error) {

            showMessage(
                getFirebaseError(error)
            );

        }

    };


    /*
    ============================================================
       SWITCH TO EMAIL
    ============================================================
    */

    window.showEmailLogin = function () {

        document
            .getElementById("emailSection")
            .classList.remove("hidden");

        document
            .getElementById("phoneSection")
            .classList.add("hidden");


        document
            .getElementById("emailTab")
            .classList.add("active");

        document
            .getElementById("phoneTab")
            .classList.remove("active");


        document.getElementById("title")
            .textContent = "Login";

        showMessage("");

    };


    /*
    ============================================================
       SWITCH TO PHONE
    ============================================================
    */

    window.showPhoneLogin = function () {

        document
            .getElementById("emailSection")
            .classList.add("hidden");

        document
            .getElementById("phoneSection")
            .classList.remove("hidden");


        document
            .getElementById("phoneTab")
            .classList.add("active");

        document
            .getElementById("emailTab")
            .classList.remove("active");


        document.getElementById("title")
            .textContent = "Mobile Login";

        showMessage("");

    };


    /*
    ============================================================
       ALREADY LOGGED IN
    ============================================================
    */

    onAuthStateChanged(
        auth,
        (user) => {

            if (user) {

                /*
                   User is already logged in.
                   You can automatically open
                   the calculator.
                */

                // Uncomment this if desired:
                // window.location.href = "index.html";

            }

        }
    );


    /*
    ============================================================
       FIREBASE ERROR MESSAGES
    ============================================================
    */

    function getFirebaseError(error) {

        const code =
            error.code || "";


        switch (code) {

            case "auth/invalid-credential":
                return "Invalid email or password.";

            case "auth/user-not-found":
                return "Account not found.";

            case "auth/wrong-password":
                return "Incorrect password.";

            case "auth/email-already-in-use":
                return "This email is already registered.";

            case "auth/weak-password":
                return "Password is too weak.";

            case "auth/invalid-email":
                return "Invalid email address.";

            case "auth/too-many-requests":
                return "Too many attempts. Please try again later.";

            case "auth/invalid-phone-number":
                return "Invalid mobile number.";

            case "auth/invalid-verification-code":
                return "Invalid OTP.";

            case "auth/code-expired":
                return "OTP expired. Please request a new OTP.";

            case "auth/quota-exceeded":
                return "SMS limit reached. Please try again later.";

            default:
                return error.message ||
                       "Something went wrong.";

        }

    }

</script>

</body>
</html>
