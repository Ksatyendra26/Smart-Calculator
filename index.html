<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#0b1220">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
content="black-translucent">

<meta name="apple-mobile-web-app-title"
content="SMART CALCULATOR">

<link rel="manifest" href="manifest.json">

<title>
SMART CALCULATOR | Smart Calculation, Smarter Business
</title>

<style>

/* =========================================================
   ROOT
========================================================= */

:root{

--bg:#eef2f7;
--card:#fff;
--soft:#f7f9fc;
--text:#0f172a;
--muted:#64748b;
--line:#e2e8f0;

--blue:#2563eb;
--green:#16a34a;
--red:#dc2626;
--amber:#d97706;

--shadow:0 18px 45px #0f172a16;

}

*{
box-sizing:border-box;
}

html,
body{
margin:0;
min-height:100%;
font-family:
Inter,
system-ui,
-apple-system,
Segoe UI,
Arial,
sans-serif;
color:var(--text);
}

body{

background:
radial-gradient(
circle at 0 0,
#dbeafe 0,
transparent 32%
),
var(--bg);

padding:12px;

}

button,
input,
select,
textarea{
font:inherit;
}

button{
cursor:pointer;
}

button:disabled{
cursor:not-allowed;
opacity:.6;
}

textarea{
resize:vertical;
min-height:90px;
}

.app{
max-width:1250px;
margin:auto;
}

/* =========================================================
   HEADER
========================================================= */

header{

display:flex;
align-items:center;
justify-content:space-between;

gap:12px;

margin-bottom:14px;

}

.brand{

display:flex;
align-items:center;
gap:11px;

}

.brand-icon{

width:48px;
height:48px;

border-radius:15px;

background:
linear-gradient(
135deg,
#2563eb,
#1d4ed8
);

color:white;

display:grid;
place-items:center;

font-weight:900;
font-size:21px;

box-shadow:
0 8px 20px #2563eb30;

}

h1{
font-size:21px;
margin:0;
font-weight:900;
}

header p{

margin:3px 0 0;

color:var(--muted);

font-size:12px;

}

.head-actions{

display:flex;
gap:7px;
align-items:center;

}

.icon{

width:42px;
height:42px;

border:1px solid var(--line);

background:var(--card);

border-radius:13px;

}

.icon:active{
transform:scale(.96);
}

/* =========================================================
   USER BOX
========================================================= */

.user-box{

display:flex;
align-items:center;

gap:8px;

padding:7px 10px;

background:var(--soft);

border-radius:12px;

font-size:11px;

}

.user-email{

max-width:160px;

overflow:hidden;

text-overflow:ellipsis;

white-space:nowrap;

}

/* =========================================================
   GRID / CARD
========================================================= */

.grid{

display:grid;

grid-template-columns:
minmax(0,1.15fr)
minmax(340px,.85fr);

gap:16px;

}

.card{

background:var(--card);

border:1px solid var(--line);

border-radius:24px;

box-shadow:var(--shadow);

overflow:hidden;

}

.pad{
padding:16px;
}

/* =========================================================
   DISPLAY
========================================================= */

.display{

background:
linear-gradient(
145deg,
#0b1220,
#182235
);

color:white;

border-radius:20px;

padding:20px;

min-height:145px;

display:flex;

flex-direction:column;

justify-content:end;

text-align:right;

}

.expr{

color:#94a3b8;

font-size:13px;

min-height:20px;

overflow:hidden;

text-overflow:ellipsis;

white-space:nowrap;

}

.result{

font-size:
clamp(36px,8vw,58px);

font-weight:850;

letter-spacing:-2px;

overflow:hidden;

text-overflow:ellipsis;

white-space:nowrap;

}

/* =========================================================
   CALCULATOR KEYS
========================================================= */

.keys{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:9px;

margin-top:12px;

}

.key{

min-height:64px;

border:0;

border-radius:17px;

background:#f1f5f9;

font-size:21px;

font-weight:750;

transition:
transform .08s ease;

}

.key:active{
transform:scale(.96);
}

.op{

background:#dbeafe;

color:#1d4ed8;

}

.eq{

background:
linear-gradient(
135deg,
#2563eb,
#1d4ed8
);

color:white;

}

.danger{

background:#fee2e2;

color:#dc2626;

}

.amber{

background:#fef3c7;

color:#b45309;

}

/* =========================================================
   BUTTONS
========================================================= */

.tools{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:8px;

margin-top:12px;

}

.btn{

border:1px solid var(--line);

background:var(--soft);

border-radius:13px;

padding:11px 6px;

font-size:12px;

font-weight:800;

transition:
transform .08s ease;

}

.btn:active{
transform:scale(.96);
}

.primary{

background:var(--blue);

color:#fff;

border-color:var(--blue);

}

.green{

background:var(--green);

color:white;

border-color:var(--green);

}

.logout{

background:#fee2e2;

color:#dc2626;

border-color:#fecaca;

}

/* =========================================================
   COMMON
========================================================= */

.section-title{

font-weight:900;

font-size:18px;

}

.muted{

color:var(--muted);

font-size:12px;

}

.row{

display:flex;

gap:8px;

align-items:center;

}

.between{

display:flex;

justify-content:space-between;

gap:10px;

align-items:center;

}

/* =========================================================
   FORM
========================================================= */

.form-grid{

display:grid;

grid-template-columns:
1fr 1fr;

gap:9px;

margin-top:12px;

}

.field label{

display:block;

color:var(--muted);

font-size:10px;

font-weight:750;

margin-bottom:4px;

}

.field input,
.field select,
.field textarea{

width:100%;

padding:11px;

border:1px solid var(--line);

border-radius:11px;

outline:none;

background:#fff;

color:var(--text);

}

.field input:focus,
.field select:focus,
.field textarea:focus{

border-color:var(--blue);

box-shadow:
0 0 0 3px #2563eb18;

}

.field.full{

grid-column:1/-1;

}

/* =========================================================
   ITEMS
========================================================= */

.items{

margin-top:13px;

border:1px solid var(--line);

border-radius:15px;

overflow:hidden;

}

.item-head,
.item{

display:grid;

grid-template-columns:
1.5fr
.6fr
.8fr
.8fr
32px;

gap:7px;

align-items:center;

padding:9px;

font-size:11px;

}

.item-head{

background:var(--soft);

color:var(--muted);

font-weight:800;

}

.item{

border-top:1px solid var(--line);

}

.item input{

width:100%;

padding:8px;

border:1px solid var(--line);

border-radius:8px;

background:var(--card);

color:var(--text);

}

.remove{

width:30px;
height:30px;

border:0;

border-radius:8px;

background:#fee2e2;

color:#dc2626;

}

/* =========================================================
   SUMMARY
========================================================= */

.summary{

margin-top:12px;

background:var(--soft);

border-radius:15px;

padding:13px;

}

.sumline{

display:flex;

justify-content:space-between;

padding:4px 0;

font-size:13px;

}

.grand{

font-size:20px;

font-weight:900;

border-top:1px solid var(--line);

margin-top:6px;

padding-top:9px;

}

/* =========================================================
   PAYMENT
========================================================= */

.payment{

text-align:center;

}

.qr{

width:min(230px,62vw);

aspect-ratio:1;

background:#fff;

border-radius:18px;

padding:12px;

margin:18px auto;

display:grid;

place-items:center;

box-shadow:
0 8px 25px #0f172a12;

}

.qr img,
.qr canvas{

max-width:200px!important;
max-height:200px!important;

}

.amount{

font-size:34px;

color:var(--green);

font-weight:900;

}

.upi{

font-size:11px;

color:var(--muted);

word-break:break-all;

margin:8px 0 12px;

}

.pay{

width:100%;

padding:14px;

border:0;

border-radius:14px;

background:var(--green);

color:white;

font-weight:900;

}

.share{

width:100%;

padding:12px;

border:0;

border-radius:14px;

background:#e2e8f0;

margin-top:8px;

font-weight:800;

}

/* =========================================================
   HISTORY
========================================================= */

.history{

margin-top:16px;

padding:16px;

}

.history-list{

max-height:240px;

overflow:auto;

margin-top:9px;

}

.hist{

display:flex;

justify-content:space-between;

gap:8px;

border-bottom:1px solid var(--line);

padding:10px 0;

font-size:12px;

}

.hist strong{
white-space:nowrap;
}

.empty{

color:var(--muted);

font-size:12px;

padding:10px 0;

}

/* =========================================================
   MODAL
========================================================= */

.modal{

position:fixed;

inset:0;

background:#0f172a99;

display:none;

place-items:center;

padding:15px;

z-index:100;

backdrop-filter:blur(5px);

}

.modal.show{

display:grid;

}

.modal-card{

width:min(650px,100%);

background:var(--card);

border-radius:22px;

padding:18px;

max-height:92vh;

overflow:auto;

}

.close{

border:0;

background:#f1f5f9;

border-radius:9px;

width:35px;

height:35px;

}

.modal-actions{

display:flex;

gap:8px;

margin-top:15px;

}

.modal-actions button{
flex:1;
}

/* =========================================================
   PROFILE
========================================================= */

.profile-header{

display:flex;

align-items:center;

gap:15px;

padding:12px;

background:var(--soft);

border-radius:16px;

margin-top:12px;

}

.profile-logo{

width:75px;

height:75px;

border-radius:16px;

object-fit:contain;

background:white;

border:1px solid var(--line);

padding:5px;

}

.logo-placeholder{

width:75px;

height:75px;

border-radius:16px;

background:#dbeafe;

color:#1d4ed8;

display:grid;

place-items:center;

font-size:28px;

font-weight:900;

}

/* =========================================================
   CUSTOMER SEARCH
========================================================= */

.customer-search{

display:flex;

gap:8px;

margin-top:12px;

}

.customer-search input{

flex:1;

padding:12px;

border:1px solid var(--line);

border-radius:12px;

outline:none;

background:var(--card);

color:var(--text);

}

.customer-list{

margin-top:10px;

max-height:260px;

overflow:auto;

}

.customer-card{

border:1px solid var(--line);

border-radius:14px;

padding:12px;

margin-bottom:8px;

background:var(--soft);

}

.customer-card-top{

display:flex;

justify-content:space-between;

gap:10px;

align-items:start;

}

.customer-name{

font-weight:900;

}

.customer-meta{

font-size:11px;

color:var(--muted);

margin-top:4px;

line-height:1.6;

}

.customer-actions{

display:flex;

gap:5px;

margin-top:8px;

}

.small-btn{

border:1px solid var(--line);

background:var(--card);

border-radius:8px;

padding:7px 10px;

font-size:11px;

font-weight:800;

}

.small-btn.delete{

background:#fee2e2;

color:#dc2626;

border-color:#fecaca;

}

/* =========================================================
   CUSTOMER PICKER
========================================================= */

.customer-picker{

display:flex;

gap:7px;

margin-top:5px;

}

.customer-picker select{

flex:1;

}

/* =========================================================
   FOOTER
========================================================= */

.footer{

text-align:center;

padding:20px;

color:var(--muted);

font-size:11px;

}

/* =========================================================
   TOOL OUTPUT
========================================================= */

.tool-output{

margin-top:14px;

background:var(--soft);

border-radius:12px;

padding:12px;

font-weight:800;

line-height:1.7;

}

/* =========================================================
   DARK MODE
========================================================= */

body.dark{

--bg:#070b14;
--card:#111827;
--soft:#182131;
--text:#f8fafc;
--muted:#94a3b8;
--line:#263244;

}

body.dark .icon,
body.dark .field input,
body.dark .field select,
body.dark .field textarea,
body.dark .customer-search input{

background:#111827;

color:#fff;

border-color:#263244;

}

body.dark .key{

background:#1e293b;

color:#fff;

}

body.dark .op{

background:#17315a;

color:#93c5fd;

}

body.dark .danger{

background:#4c1d1d;

color:#fecaca;

}

body.dark .amber{

background:#4a3510;

color:#fde68a;

}

body.dark .share{

background:#263244;

color:#fff;

}

body.dark .small-btn{

background:#111827;

color:#fff;

border-color:#263244;

}

/* =========================================================
   LOGIN
========================================================= */

.login-gate{

position:fixed;

inset:0;

z-index:999;

background:
linear-gradient(
135deg,
#0b1220,
#1e3a8a
);

display:none;

align-items:center;

justify-content:center;

padding:20px;

}

.login-gate.show{

display:flex;

}

.gate-card{

width:min(430px,100%);

background:#fff;

color:#0f172a;

border-radius:28px;

padding:28px;

box-shadow:
0 25px 70px #0005;

text-align:center;

}

.gate-logo{

width:72px;

height:72px;

border-radius:20px;

background:#2563eb;

color:#fff;

display:grid;

place-items:center;

font-size:34px;

font-weight:900;

margin:0 auto 14px;

}

.gate-card h2{
margin:0;
}

.gate-card p{

color:#64748b;

font-size:13px;

line-height:1.5;

}

.gate-btn{

display:block;

width:100%;

padding:14px;

border:0;

border-radius:13px;

background:#2563eb;

color:#fff;

font-weight:900;

font-size:15px;

margin-top:14px;

}

.gate-btn.secondary{

background:#16a34a;

}

.gate-btn.outline{

background:#f1f5f9;

color:#0f172a;

}

.gate-msg{

min-height:18px;

color:#dc2626;

font-size:12px;

font-weight:700;

margin-top:10px;

}

.auth-form{

margin-top:15px;

text-align:left;

}

.auth-form input{

width:100%;

padding:13px;

border:1px solid #dbe3ee;

border-radius:12px;

margin-bottom:9px;

outline:none;

}

.auth-switch{

margin-top:14px;

font-size:12px;

color:#64748b;

}

.auth-switch button{

border:0;

background:none;

color:#2563eb;

font-weight:800;

}

.auth-tabs{

display:flex;

gap:8px;

margin-top:18px;

padding:4px;

background:#f1f5f9;

border-radius:14px;

}

.auth-tab{

flex:1;

border:0;

background:transparent;

color:#64748b;

padding:11px 8px;

border-radius:10px;

font-weight:800;

cursor:pointer;

}

.auth-tab.active{

background:#fff;

color:#2563eb;

box-shadow:
0 2px 8px #0f172a14;

}

.phone-row{

display:flex;

gap:8px;

align-items:center;

}

.phone-row .country-code{

flex:0 0 auto;

padding:13px 10px;

border:1px solid #dbe3ee;

border-radius:12px;

background:#f8fafc;

font-weight:800;

font-size:13px;

}

.phone-row input{

flex:1;

min-width:0;

}

#recaptcha-container{

display:flex;

justify-content:center;

overflow:hidden;

}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:850px){

.grid{

grid-template-columns:1fr;

}

.payment{

max-width:620px;

margin:auto;

}

}

@media(max-width:520px){

body{
padding:8px;
}

.brand-icon{

width:42px;
height:42px;

}

.brand h1{
font-size:18px;
}

.grid{
gap:10px;
}

.pad{
padding:10px;
}

.key{
min-height:58px;
}

.tools{

grid-template-columns:
repeat(2,1fr);

}

.item-head,
.item{

grid-template-columns:
1.2fr
.55fr
.75fr
.8fr
30px;

font-size:10px;

}

.form-grid{

grid-template-columns:1fr;

}

.field.full{
grid-column:auto;
}

.user-box{
display:none;
}

}

@media(max-width:350px){

.key{

min-height:52px;

font-size:17px;

}

.result{
font-size:32px;
}

}

/* =========================================================
   PRINT
========================================================= */

@media print{

body{

background:white;

padding:0;

}

.app>header,
.grid,
.history,
.footer,
.modal{

display:none!important;

}

.invoice{

display:block!important;

}

}

</style>

</head>

<body>

<!-- ======================================================
     LOGIN GATE
======================================================= -->

<div class="login-gate" id="loginGate">

<div class="gate-card">

<div class="gate-logo">₹</div>

<h2>SMART CALCULATOR</h2>

<p>

<strong>Smart Calculation</strong><br>

Login is required to use the calculator
and billing system.

</p>

<div class="auth-tabs">

<button
type="button"
class="auth-tab active"
id="emailTab"
onclick="showEmailLogin()">

✉️ Email

</button>

<button
type="button"
class="auth-tab"
id="phoneTab"
onclick="showPhoneLogin()">

📱 Mobile OTP

</button>

</div>

<!-- EMAIL -->

<div
class="auth-form"
id="emailAuthForm">

<input
id="authEmail"
type="email"
placeholder="Email address"
autocomplete="email">

<input
id="authPassword"
type="password"
placeholder="Password"
autocomplete="current-password">

<button
class="gate-btn"
id="loginBtn"
onclick="loginUser()">

🔐 LOGIN

</button>

<button
class="gate-btn secondary"
id="signupBtn"
onclick="signupUser()">

👤 CREATE ACCOUNT

</button>

<button
class="gate-btn outline"
onclick="resetPassword()">

🔑 FORGOT PASSWORD

</button>

</div>

<!-- PHONE -->

<div
class="auth-form"
id="phoneAuthForm"
style="display:none">

<div class="phone-row">

<div class="country-code">
🇮🇳 +91
</div>

<input
id="authPhone"
type="tel"
inputmode="numeric"
maxlength="10"
placeholder="Mobile number"
autocomplete="tel-national">

</div>

<button
class="gate-btn"
id="sendOtpBtn"
onclick="sendPhoneOTP()">

📲 SEND OTP

</button>

<div
id="otpSection"
style="display:none">

<input
id="authOtp"
type="text"
inputmode="numeric"
maxlength="6"
placeholder="Enter 6-digit OTP"
autocomplete="one-time-code">

<button
class="gate-btn secondary"
id="verifyOtpBtn"
onclick="verifyPhoneOTP()">

🔐 VERIFY OTP

</button>

<button
class="gate-btn outline"
id="resendOtpBtn"
onclick="sendPhoneOTP(true)">

↻ RESEND OTP

</button>

</div>

<div
id="recaptcha-container"
style="margin-top:10px">

</div>

</div>

<div
id="gateMsg"
class="gate-msg">

</div>

</div>

</div>


<div class="app">

<!-- ======================================================
     HEADER
======================================================= -->

<header>

<div class="brand">

<div class="brand-icon">
₹
</div>

<div>

<h1>
SMART CALCULATOR
</h1>

<p>
Smart Calculation, Smarter Business
</p>

</div>

</div>

<div class="head-actions">

<div class="user-box">

👤

<span
id="userEmail"
class="user-email">

Not logged in

</span>

</div>

<button
class="icon"
id="profileBtn"
onclick="openProfile()"
title="Business Profile">

👤

</button>

<button
class="icon"
onclick="openCustomers()"
title="Customer Database">

👥

</button>

<button
class="icon"
id="installBtn"
title="Install"
hidden>

⬇️

</button>

<button
class="icon"
onclick="toggleDark()"
title="Theme">

🌙

</button>

<button
class="icon"
onclick="logoutUser()"
title="Logout">

🚪

</button>

</div>

</header>


<!-- ======================================================
     MAIN GRID
======================================================= -->

<div class="grid">


<!-- ======================================================
     CALCULATOR
======================================================= -->

<section class="card pad">

<div class="display">

<div
class="expr"
id="expr">
</div>

<div
class="result"
id="display">

0

</div>

</div>


<div class="keys">

<button
class="key danger"
onclick="clearCalc()">

AC

</button>

<button
class="key amber"
onclick="backspace()">

⌫

</button>

<button
class="key"
onclick="percent()">

%

</button>

<button
class="key op"
onclick="op('/')">

÷

</button>


<button
class="key"
onclick="num('7')">

7

</button>

<button
class="key"
onclick="num('8')">

8

</button>

<button
class="key"
onclick="num('9')">

9

</button>

<button
class="key op"
onclick="op('*')">

×

</button>


<button
class="key"
onclick="num('4')">

4

</button>

<button
class="key"
onclick="num('5')">

5

</button>

<button
class="key"
onclick="num('6')">

6

</button>

<button
class="key op"
