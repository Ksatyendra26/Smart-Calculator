<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SMART CALCULATOR - Kushwaha Traders</title>

<!-- QR CODE LIBRARY -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#eef2ff,#f8fafc);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.app{
    width:100%;
    max-width:430px;
    background:white;
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.15);
}

/* HEADER */

.header{
    background:linear-gradient(135deg,#111827,#1e293b);
    color:white;
    padding:22px;
}

.logo{
    font-size:25px;
    font-weight:800;
    letter-spacing:1px;
}

.business{
    margin-top:5px;
    font-size:14px;
    opacity:.8;
}

/* DISPLAY */

.display{
    background:#111827;
    color:white;
    padding:20px 24px;
    text-align:right;
}

.expression{
    color:#94a3b8;
    font-size:15px;
    min-height:20px;
}

.result{
    font-size:42px;
    font-weight:700;
    margin-top:5px;
}

/* KEYPAD */

.keypad{
    padding:14px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.key{
    height:62px;
    border:0;
    border-radius:17px;
    background:#f1f5f9;
    font-size:21px;
    font-weight:600;
    cursor:pointer;
}

.key:active{
    transform:scale(.95);
}

.operator{
    background:#dbeafe;
    color:#1d4ed8;
}

.clear{
    background:#fee2e2;
    color:#dc2626;
}

.equal{
    background:#2563eb;
    color:white;
}

/* UPI SECTION */

.upi-box{
    margin:10px 14px 18px;
    padding:20px;
    border-radius:22px;
    background:#f8fafc;
    border:1px solid #e2e8f0;
    text-align:center;
}

.upi-title{
    font-size:20px;
    font-weight:800;
    color:#0f172a;
}

.upi-business{
    font-size:14px;
    color:#64748b;
    margin-top:4px;
}

.qr-container{
    width:210px;
    height:210px;
    background:white;
    margin:18px auto;
    padding:10px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

#qrcode img,
#qrcode canvas{
    max-width:190px;
    max-height:190px;
}

.amount-label{
    font-size:12px;
    color:#64748b;
}

.amount{
    font-size:34px;
    font-weight:800;
    color:#16a34a;
    margin:3px 0 15px;
}

.upi-id{
    font-size:13px;
    color:#475569;
    margin-bottom:15px;
    word-break:break-all;
}

/* BUTTONS */

.pay-btn{
    width:100%;
    padding:15px;
    border:0;
    border-radius:14px;
    background:#16a34a;
    color:white;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    margin-bottom:9px;
}

.pay-btn:active{
    transform:scale(.98);
}

.share-btn{
    width:100%;
    padding:13px;
    border:0;
    border-radius:14px;
    background:#e2e8f0;
    color:#0f172a;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
}

/* SETTINGS */

.settings{
    margin-top:12px;
    text-align:left;
}

.settings label{
    display:block;
    font-size:12px;
    color:#64748b;
    margin-bottom:5px;
}

.settings input{
    width:100%;
    padding:11px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    outline:none;
    margin-bottom:10px;
}

.footer{
    text-align:center;
    font-size:11px;
    color:#94a3b8;
    padding:10px 0 16px;
}

</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            SMART CALCULATOR
        </div>

        <div class="business">
            Kushwaha Traders
        </div>

    </div>


    <!-- CALCULATOR DISPLAY -->

    <div class="display">

        <div class="expression" id="expression"></div>

        <div class="result" id="display">
            0
        </div>

    </div>


    <!-- CALCULATOR -->

    <div class="keypad">

        <button class="key clear"
                onclick="clearAll()">AC</button>

        <button class="key"
                onclick="deleteLast()">⌫</button>

        <button class="key"
                onclick="percentage()">%</button>

        <button class="key operator"
                onclick="operator('/')">÷</button>


        <button class="key"
                onclick="number('7')">7</button>

        <button class="key"
                onclick="number('8')">8</button>

        <button class="key"
                onclick="number('9')">9</button>

        <button class="key operator"
                onclick="operator('*')">×</button>


        <button class="key"
                onclick="number('4')">4</button>

        <button class="key"
                onclick="number('5')">5</button>

        <button class="key"
                onclick="number('6')">6</button>

        <button class="key operator"
                onclick="operator('-')">−</button>


        <button class="key"
                onclick="number('1')">1</button>

        <button class="key"
                onclick="number('2')">2</button>

        <button class="key"
                onclick="number('3')">3</button>

        <button class="key operator"
                onclick="operator('+')">+</button>


        <button class="key"
                onclick="number('00')">00</button>

        <button class="key"
                onclick="number('0')">0</button>

        <button class="key"
                onclick="decimal()">.</button>

        <button class="key equal"
                onclick="calculate()">=</button>

    </div>


    <!-- UPI PAYMENT -->

    <div class="upi-box">

        <div class="upi-title">
            PAY WITH UPI
        </div>

        <div class="upi-business">
            Kushwaha Traders
        </div>


        <!-- QR -->

        <div class="qr-container">

            <div id="qrcode"></div>

        </div>


        <div class="amount-label">
            PAYMENT AMOUNT
        </div>

        <div class="amount">
            ₹ <span id="upiAmount">0.00</span>
        </div>


        <div class="upi-id">
            UPI ID:
            <strong id="upiDisplay">
                YOURUPIID@upi
            </strong>
        </div>


        <!-- PAY NOW -->

        <button class="pay-btn"
                onclick="payNow()">

            💳 PAY NOW

        </button>


        <!-- SHARE -->

        <button class="share-btn"
                onclick="sharePayment()">

            📤 SHARE PAYMENT

        </button>


        <!-- UPI SETTINGS -->

        <div class="settings">

            <label>
                Your UPI ID
            </label>

            <input
                type="text"
                id="upiInput"
                value="YOURUPIID@upi"
                placeholder="example@upi"
                oninput="updateUPI()">

        </div>

    </div>


    <div class="footer">
        SMART CALCULATOR © 2026
    </div>

</div>


<script>

/* =====================================
   CALCULATOR
===================================== */

let current = "0";
let previous = null;
let currentOperator = null;
let shouldReset = false;


const display =
    document.getElementById("display");

const expression =
    document.getElementById("expression");


function updateDisplay(){

    display.textContent = current;

    updatePayment();

}


function number(value){

    if(current === "0" || shouldReset){

        current = value;
        shouldReset = false;

    }else{

        current += value;

    }

    updateDisplay();

}


function decimal(){

    if(shouldReset){

        current = "0.";
        shouldReset = false;

    }else if(!current.includes(".")){

        current += ".";

    }

    updateDisplay();

}


function operator(op){

    if(currentOperator && !shouldReset){

        calculate();

    }

    previous = parseFloat(current);

    currentOperator = op;

    shouldReset = true;

    expression.textContent =
        previous + " " + symbol(op);

}


function symbol(op){

    if(op === "+") return "+";
    if(op === "-") return "−";
    if(op === "*") return "×";
    if(op === "/") return "÷";

}


function calculate(){

    if(previous === null ||
       currentOperator === null){

        return;

    }

    let second =
        parseFloat(current);

    let result;


    switch(currentOperator){

        case "+":

            result =
                previous + second;

            break;


        case "-":

            result =
                previous - second;

            break;


        case "*":

            result =
                previous * second;

            break;


        case "/":

            if(second === 0){

                current = "Error";

                updateDisplay();

                reset();

                return;

            }

            result =
                previous / second;

            break;

    }


    expression.textContent =
        previous +
        " " +
        symbol(currentOperator) +
        " " +
        second +
        " =";


    current =
        formatNumber(result);


    reset();

    updateDisplay();

}


function formatNumber(num){

    return Number(
        parseFloat(num.toFixed(10))
    ).toString();

}


function reset(){

    previous = null;
    currentOperator = null;
    shouldReset = true;

}


function clearAll(){

    current = "0";

    previous = null;

    currentOperator = null;

    shouldReset = false;

    expression.textContent = "";

    updateDisplay();

}


function deleteLast(){

    if(current.length > 1){

        current =
            current.slice(0,-1);

    }else{

        current = "0";

    }

    updateDisplay();

}


function percentage(){

    let value =
        parseFloat(current);

    current =
        formatNumber(value / 100);

    updateDisplay();

}


/* =====================================
   UPI PAYMENT
===================================== */

let upiID =
    "YOURUPIID@upi";

let merchantName =
    "Kushwaha Traders";


/*
   UPDATE UPI
*/

function updateUPI(){

    upiID =
        document.getElementById(
            "upiInput"
        ).value.trim();

    document.getElementById(
        "upiDisplay"
    ).textContent = upiID;

    updatePayment();

}


/*
   CREATE UPI PAYMENT LINK
*/

function createUPILink(){

    let amount =
        parseFloat(current);

    if(isNaN(amount) || amount <= 0){

        return "";

    }


    let upiLink =
        "upi://pay" +

        "?pa=" +
        encodeURIComponent(upiID) +

        "&pn=" +
        encodeURIComponent(merchantName) +

        "&am=" +
        amount.toFixed(2) +

        "&cu=INR" +

        "&tn=" +
        encodeURIComponent(
            "Payment to Kushwaha Traders"
        );


    return upiLink;

}


/*
   UPDATE QR
*/

function updatePayment(){

    let amount =
        parseFloat(current);


    if(isNaN(amount) ||
       amount < 0){

        amount = 0;

    }


    document.getElementById(
        "upiAmount"
    ).textContent =
        amount.toFixed(2);


    /*
       CLEAR OLD QR
    */

    let qr =
        document.getElementById(
            "qrcode"
        );

    qr.innerHTML = "";


    /*
       DON'T CREATE QR FOR ZERO
    */

    if(amount <= 0){

        qr.innerHTML =
            "<span style='font-size:12px;color:#94a3b8'>" +
            "Enter amount" +
            "</span>";

        return;

    }


    /*
       CREATE NEW UPI QR
    */

    let link =
        createUPILink();


    new QRCode(qr,{

        text:link,

        width:190,

        height:190,

        correctLevel:
            QRCode.CorrectLevel.H

    });

}


/*
   PAY NOW
*/

function payNow(){

    let amount =
        parseFloat(current);


    if(isNaN(amount) ||
       amount <= 0){

        alert(
            "Please enter a payment amount first."
        );

        return;

    }


    let link =
        createUPILink();


    /*
       Open UPI application
    */

    window.location.href = link;

}


/*
   SHARE PAYMENT
*/

async function sharePayment(){

    let amount =
        parseFloat(current);


    if(isNaN(amount) ||
       amount <= 0){

        alert(
            "Please enter an amount first."
        );

        return;

    }


    let message =
        "Payment Request\n\n" +

        "Business: " +
        merchantName +

        "\nAmount: ₹" +
        amount.toFixed(2) +

        "\nUPI ID: " +
        upiID;


    if(navigator.share){

        try{

            await navigator.share({

                title:
                    "Payment to Kushwaha Traders",

                text:
                    message,

                url:
                    createUPILink()

            });

        }catch(error){

            console.log(error);

        }

    }else{

        await navigator.clipboard.writeText(
            message
        );

        alert(
            "Payment details copied."
        );

    }

}


/*
   INITIALIZE
*/

updatePayment();


/* =====================================
   KEYBOARD
===================================== */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key >= "0" &&
           e.key <= "9"){

            number(e.key);

        }

        else if(e.key === "."){

            decimal();

        }

        else if(
            ["+","-","*","/"].includes(e.key)
        ){

            operator(e.key);

        }

        else if(
            e.key === "Enter" ||
            e.key === "="
        ){

            calculate();

        }

        else if(
            e.key === "Backspace"
        ){

            deleteLast();

        }

        else if(
            e.key === "Escape"
        ){

            clearAll();

        }

        else if(e.key === "%"){

            percentage();

        }

    }
);

</script>

</body>
</html>
